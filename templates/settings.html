{% extends 'base.html' %}

{% block page_title %}Settings{% endblock %}
{% block page_subtitle %}Manage your profile and account settings{% endblock %}

{% block content %}
<div class="settings-grid">
    <!-- Profile -->
    <div class="panel">
        <div class="panel-header">
            <h3 class="panel-title"><i class="fa-regular fa-user" style="color: var(--accent-cyan);"></i> Profile</h3>
        </div>
        <form method="POST" action="{{ url_for('settings') }}">
            <input type="hidden" name="action" value="update_profile">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" class="form-control" value="{{ user.username }}" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" class="form-control" value="{{ user.email }}" required>
            </div>
            <div class="form-group">
                <label>Role</label>
                <input type="text" class="form-control" value="{{ user.role }}" disabled style="opacity: 0.6;">
            </div>
            <div class="form-group">
                <label>Account Created</label>
                <input type="text" class="form-control" value="{{ user.created_at.strftime('%Y-%m-%d %I:%M %p') }}" disabled style="opacity: 0.6;">
            </div>
            <button type="submit" class="btn btn-primary"><i class="fa-solid fa-check"></i> Update Profile</button>
        </form>
    </div>

    <!-- Change Password -->
    <div class="panel">
        <div class="panel-header">
            <h3 class="panel-title"><i class="fa-solid fa-lock" style="color: var(--accent-amber);"></i> Change Password</h3>
        </div>
        <form method="POST" action="{{ url_for('settings') }}">
            <input type="hidden" name="action" value="change_password">
            <div class="form-group">
                <label for="current_password">Current Password</label>
                <input type="password" id="current_password" name="current_password" class="form-control" required placeholder="Enter current password">
            </div>
            <div class="form-group">
                <label for="new_password">New Password</label>
                <input type="password" id="new_password" name="new_password" class="form-control" required placeholder="Min. 6 characters" minlength="6">
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm New Password</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" required placeholder="Re-enter new password">
            </div>
            <button type="submit" class="btn btn-primary"><i class="fa-solid fa-key"></i> Change Password</button>
        </form>
    </div>
</div>
{% endblock %}
